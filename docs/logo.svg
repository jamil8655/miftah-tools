<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%">
  <defs>
    <linearGradient id="logoKeyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <linearGradient id="logoGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Left Key Emblem (120x120 within 160 height) -->
  <g transform="translate(20, 20) scale(0.24)">
    <rect width="512" height="512" rx="128" fill="#0B1936" />
    <path
      d="M 140 230 C 140 145, 200 100, 256 100 C 312 100, 372 145, 372 230 C 372 280, 335 310, 290 325 L 290 400 L 350 400 L 350 435 L 290 435 L 290 460 L 330 460 L 330 490 L 256 490 C 235 490, 222 475, 222 455 L 222 325 C 177 310, 140 280, 140 230 Z"
      fill="url(#logoKeyGrad)"
    />
    <path d="M 178 220 C 178 165, 210 135, 240 135 C 246 135, 250 140, 248 155 L 242 200 C 240 215, 225 235, 205 245 C 188 253, 178 240, 178 220 Z" fill="#0B1936" />
    <path d="M 334 220 C 334 165, 302 135, 272 135 C 266 135, 262 140, 264 155 L 270 200 C 272 215, 287 235, 307 245 C 324 253, 334 240, 334 220 Z" fill="#0B1936" />
    <circle cx="256" cy="240" r="18" fill="url(#logoGoldGrad)" />
    <polygon points="250,248 262,248 266,285 246,285" fill="url(#logoGoldGrad)" />
  </g>

  <!-- Typography: MIFTAH TOOLS -->
  <text x="165" y="85" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" letter-spacing="-1" fill="#0284C7">
    MIFTAH
  </text>
  <text x="345" y="85" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" letter-spacing="-1" fill="#0F172A">
    TOOLS
  </text>
  <text x="168" y="118" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#64748B">
    THE KEY TO DIGITAL MASTERY
  </text>
</svg>
