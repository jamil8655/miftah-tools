<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070D1E" />
      <stop offset="50%" stop-color="#0B1936" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Key Primary Cyan-Indigo Gradient -->
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="40%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Key Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Inner Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle / Rounded Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="180" r="140" fill="#0284C7" opacity="0.25" filter="url(#glow)" />
  <circle cx="256" cy="360" r="100" fill="#6366F1" opacity="0.2" filter="url(#glow)" />

  <!-- Miftah (Key + M) Emblem -->
  <g filter="url(#shadow)">
    <!-- Outer 'M' Geometric Key Bow (Head of the Key) -->
    <path
      d="M 140 230 
         C 140 145, 200 100, 256 100 
         C 312 100, 372 145, 372 230 
         C 372 280, 335 310, 290 325 
         L 290 400 
         L 350 400 
         L 350 435 
         L 290 435 
         L 290 460 
         L 330 460 
         L 330 490 
         L 256 490 
         C 235 490, 222 475, 222 455 
         L 222 325 
         C 177 310, 140 280, 140 230 Z"
      fill="url(#keyGrad)"
    />

    <!-- Stylized 'M' Inner Cuts & Central Keyhole -->
    <!-- Left M Arch Cutout -->
    <path
      d="M 178 220 
         C 178 165, 210 135, 240 135 
         C 246 135, 250 140, 248 155 
         L 242 200 
         C 240 215, 225 235, 205 245 
         C 188 253, 178 240, 178 220 Z"
      fill="#070D1E"
    />

    <!-- Right M Arch Cutout -->
    <path
      d="M 334 220 
         C 334 165, 302 135, 272 135 
         C 266 135, 262 140, 264 155 
         L 270 200 
         C 272 215, 287 235, 307 245 
         C 324 253, 334 240, 334 220 Z"
      fill="#070D1E"
    />

    <!-- Center Keyhole Spark (The Unlock Core) -->
    <circle cx="256" cy="240" r="18" fill="url(#goldGrad)" />
    <polygon points="250,248 262,248 266,285 246,285" fill="url(#goldGrad)" />

    <!-- Top M Apex Sparkle Star -->
    <circle cx="256" cy="100" r="6" fill="#FCD34D" />
    <path d="M 256 86 L 259 97 L 270 100 L 259 103 L 256 114 L 253 103 L 242 100 L 253 97 Z" fill="#FFFFFF" />
  </g>
</svg>
